# =====================================================================
# Cloudflare Pages configuration for sitetrace-api
# (deployed 2026-10-04 — bump 1/2 to fix the X-Robots-Tag wrapper bug in public-path middleware.)
# Docs: https://developers.cloudflare.com/pages/functions/wrangler-configuration/
#
# Account: 77fe51d9a2d7003d0c9917a3f7d6dcb6
# Project name: sitetrace-api
# GitHub repo: appenzellerdigitalstore-stack/sitetrace-cloud
# Public URL: https://api.sitetrace.it.com (DNS lives in Cloudflare,
#             apex zone sits on dane.ns.cloudflare.com +
#             maxine.ns.cloudflare.com)
# =====================================================================
name = "sitetrace-api"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "."

# No build step — site is plain static files + Functions. Cloudflare
# Pages serves them as-is. The Functions runtime resolves
# @cloudflare/puppeteer at runtime when Browser Rendering is enabled
# in the dashboard; we deploy with --no-bundle so wrangler doesn't
# try to bundle the import.

# ---------------------------------------------------------------------
# D1 database — users, API keys, usage, rate-limits
# Created: 2026-09-28  id: 13dc30d3-f565-481e-834b-6e5c5a43d43a
# ---------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "sitetrace-api"
database_id = "13dc30d3-f565-481e-834b-6e5c5a43d43a"

# ---------------------------------------------------------------------
# KV namespace — used by the middleware for SSL/CT 24h cache.
# Created: 2026-09-07  id: 34a24f07e7e140948b4491df07f0d62d
# ---------------------------------------------------------------------
[[kv_namespaces]]
binding = "RATELIMIT"
id = "34a24f07e7e140948b4491df07f0d62d"

# ---------------------------------------------------------------------
# Paddle Billing integration
#
# Product IDs (Paddle sandbox) live in [vars] below so they ship with
# the deploy and the CF Pages API's lack of a var-create endpoint is
# a non-issue. Secrets stay in the CF dashboard (never commit them).
#
# Sandbox ↔ live flip: rotate the two secrets in the dashboard and
# update the two product IDs in [vars] below. No other code change.
# ---------------------------------------------------------------------
[vars]
# Paddle product IDs (sandbox).
# 2026-10-02: switched to T1-T4 linear pricing ($9/$19/$29/$49). The T1-T4
# product/price IDs are placeholders until Ed creates them in Paddle sandbox;
# for now the code accepts both old (hobby/pro) and new (T1-T4) plan names.
# When Ed creates the T1-T4 products in Paddle dashboard, paste the new
# pro_* IDs into PADDLE_PRODUCT_T1/T2/T3/T4 below and the old T1/T2/T3/T4
# sandbox subs (currently none) will use them.
PADDLE_PRODUCT_HOBBY = "pro_01m3tc3y6p4sf9xn01zknr03jp"
PADDLE_PRODUCT_PRO   = "pro_01m3tchdmcwqdpkh6tkarwacar"
PADDLE_PRODUCT_T1     = ""   # TODO: Ed — create in Paddle sandbox
PADDLE_PRODUCT_T2     = ""   # TODO: Ed — create in Paddle sandbox
PADDLE_PRODUCT_T3     = ""   # TODO: Ed — create in Paddle sandbox
PADDLE_PRODUCT_T4     = ""   # TODO: Ed — create in Paddle sandbox

# Cloudflare Turnstile — bot challenge on /api/signup. Site key goes
# in signup.html (data-sitekey); secret key lives in the CF dashboard
# as a secret (NEVER in wrangler.toml's public [vars] block — anyone
# with repo access could read it). When TURNSTILE_SECRET is unset,
# signup skips Turnstile entirely and relies on the disposable
# blocklist + IP-cap. Ed grabs both keys from the CF dashboard
# (Workers & Pages → Turnstile → Add site).
# Set in the dashboard:
#   TURNSTILE_SECRET   0x4AAAAAAA...  (paste the secret key)

# ---------------------------------------------------------------------
# Browser Rendering — headless Chrome for the screenshot API
# Enable in CF dashboard: Workers & Pages → Settings → Browser Rendering
# Then uncomment the [[browser]] block below.
# Requires Workers Paid plan ($5/mo, includes 500 min browser time).
# ---------------------------------------------------------------------
# [[browser]]
# binding = "BROWSER"
