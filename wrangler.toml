# =====================================================================
# Cloudflare Pages configuration for sitetrace-api
# Docs: https://developers.cloudflare.com/pages/functions/wrangler-configuration/
#
# Account: 77fe51d9a2d7003d0c9917a3f7d6dcb6
# Project name: sitetrace-api
# GitHub repo: appenzellerdigitalstore-stack/sitetrace-cloud
# Public URL: https://api.sitetrace.it.com (DNS lives in Cloudflare,
#             apex zone sits on dane.ns.cloudflare.com +
#             maxine.ns.cloudflare.com)
# =====================================================================
name = "sitetrace-api"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "."

# No build step — site is plain static files + Functions. Cloudflare
# Pages serves them as-is. The Functions runtime resolves
# @cloudflare/puppeteer at runtime when Browser Rendering is enabled
# in the dashboard; we deploy with --no-bundle so wrangler doesn't
# try to bundle the import.

# ---------------------------------------------------------------------
# D1 database — users, API keys, usage, rate-limits
# Created: 2026-09-28  id: 13dc30d3-f565-481e-834b-6e5c5a43d43a
# ---------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "sitetrace-api"
database_id = "13dc30d3-f565-481e-834b-6e5c5a43d43a"

# ---------------------------------------------------------------------
# KV namespace — used by the middleware for SSL/CT 24h cache.
# Created: 2026-09-07  id: 34a24f07e7e140948b4491df07f0d62d
# ---------------------------------------------------------------------
[[kv_namespaces]]
binding = "RATELIMIT"
id = "34a24f07e7e140948b4491df07f0d62d"

# ---------------------------------------------------------------------
# Paddle Billing integration
#
# Product IDs are public catalog identifiers, NOT secrets — kept here
# in [vars] so they ship with the deploy. (Per Cloudflare, when
# wrangler.toml manages vars, the dashboard UI greys out plaintext
# vars; only Secrets can be added via the dashboard.)
#
# Secrets (NEVER commit) — set via CF dashboard Variables and secrets:
#     PADDLE_WEBHOOK_SECRET    Paddle → Developer tools → Notifications
#     PADDLE_API_KEY           Paddle → Developer tools → Authentication
#
# Sandbox product IDs (flip to live by editing this file + rotating secrets).
# ---------------------------------------------------------------------
[vars]
PADDLE_PRODUCT_HOBBY  = "pro_01m3tc3y6p4sf9xn01zknr03jp"
PADDLE_PRODUCT_PRO    = "pro_01m3tchdmcwqdpkh6tkarwacar"
PADDLE_PRODUCT_VOLUME = "pro_01m3tcrgxj2wa0w489zmysbc6d"

# ---------------------------------------------------------------------
# Browser Rendering — headless Chrome for the screenshot API
# Enable in CF dashboard: Workers & Pages → Settings → Browser Rendering
# Then uncomment the [[browser]] block below.
# Requires Workers Paid plan ($5/mo, includes 500 min browser time).
# ---------------------------------------------------------------------
# [[browser]]
# binding = "BROWSER"
